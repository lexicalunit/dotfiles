[env]
# Global default Python environment; created by mise with uv and managed by `equip mise`.
# Projects override this with their own `_.python.venv` or by activating their own venv.
_.python.venv = { path = "{{env.HOME}}/.venv", create = true, uv_create_args = ["--seed"] }

[settings]
# Also respect version files like .nvmrc, .node-version, .ruby-version, and .terraform-version
# in projects.
idiomatic_version_file_enable_tools = ["node", "ruby", "terraform", "yarn"]

[tools]
java = "temurin-21"
node = "lts"
python = "3.14"
ruby = "4.0"
terraform = "latest"

# Global npm CLI tools; these survive node upgrades, unlike `npm install -g`.
# corepack provides the yarn and pnpm versions that projects pin in package.json, since
# node no longer bundles it.
"npm:corepack" = "latest"
"npm:npm-check-updates" = "latest"
"npm:typescript" = "latest"
